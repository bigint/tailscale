name: System Update

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        host:
          - adguard
          - worldstream
          - proxmox-1
          - proxmox-2
          - proxmox-3
          - proxmox-4
          - proxmox-5
          - yoginth-com
          - hey-xyz
          - tsflow
          - unifi
          - grafana
          - analytics
          - beszel
          # - gatus
          - linkding
          - invoiceninja
          - postgres
          - valkey
          - bengaluru
          - bichon
          - clyde
    uses: ./.github/workflows/reusable-system-update.yml
    with:
      host: ${{ matrix.host }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
